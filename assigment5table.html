<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Price List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h1 {
            text-align: center;
        }
        table {
            width: 80%;
            margin: 20px auto;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #333;
            color: white;
        }
        tfoot td {
            font-weight: bold;
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

    <h1>Samsung A14 Mobile - Electronics Price List</h1>
    <h2 style="text-align:center;">Our Store - Product Price List</h2>

    <table>
        <thead>
            <tr>
                <th>Product Category</th>
                <th>Product Name</th>
                <th>Price</th>
                <th>In Stock</th>
            </tr>
        </thead>

        <tbody>
            <!-- Mobile Category - 2 rows merged -->
            <tr>
                <td rowspan="2">Mobile</td>
                <td>Samsung A14 Mobile</td>
                <td>$250</td>
                <td>Yes</td>
            </tr>
            <tr>
                <td>iPhone 13</td>
                <td>$799</td>
                <td>No</td>
            </tr>

            <!-- Laptop Category - 2 rows merged -->
            <tr>
                <td rowspan="2">Laptop</td>
                <td>HP Laptop 15</td>
                <td>$650</td>
                <td>Yes</td>
            </tr>
            <tr>
                <td>MacBook Pro</td>
                <td>$1200</td>
                <td>No</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <td colspan="2">Total Products: 4</td>
                <td colspan="2">Summary: 2 In Stock, 2 Out of Stock</td>
            </tr>
        </tfoot>
    </table>

</body>
</html>
